# Offline event harness: never initialize an adapter, access registers or execute a flash loader.
noinit
tcl port disabled
gdb port disabled
telnet port disabled
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32c5x.cfg]

proc stm32c5x_dbgmcu_mmw {args} {}
proc stm32c5x_mrw {args} { return $::_ep_devid }
set _ep_flash_kb 512
proc mrh {addr} { return $::_ep_flash_kb }
set _ep_fail {}
proc stldr {args} {
    if {$::_ep_fail eq [lindex $args 0]} { error EP_LOADER_FAILURE }
    echo EP_STLDR=$args
}

# invoke-event requires real init. Evaluate the registered body in a caller frame instead.
proc _ep_test_examine {} {
    set _CHIPNAME wrong
    set dev_id_loader {}
    eval [[target current] cget -event examine-end]
}
