name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  cpp-gdb:
    name: GCC ${{ matrix.gcc }} C++${{ matrix.standard }} DWARF ${{ matrix.dwarf }}
    runs-on: ubuntu-latest
    container:
      image: gcc:${{ matrix.gcc }}
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gcc: [14, 15]
        standard: [17, 20]
        dwarf: [4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: apt-get update && apt-get install -y gdb
      - run: node test/gdb/cpp-paused.test.js
        env:
          CPP_DWARF: ${{ matrix.dwarf }}
          CPP_STANDARD: ${{ matrix.standard }}
      - run: node test/gdb/printer-modes.test.js
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-gdb-${{ matrix.gcc }}-${{ matrix.standard }}-dwarf-${{ matrix.dwarf }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  arm-images:
    name: ARM GDB image transfers (memory-only RSP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi gdb-multiarch
      - run: node test/gdb/debug-images.test.js
        env:
          IMAGE_GDB: gdb-multiarch
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm-images
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  check:
    name: Node ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run checks
        run: npm run check
      - name: Verify bundle
        run: npm run bundle
      - name: Verify VSIX STL budget and exclusions
        if: runner.os == 'Linux'
        run: |
          npm run package
          node scripts/verify-stl-vsix.js
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}
          path: |
            test-results/
            coverage/
            .vscode-test/**/logs/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality
          path: |
            test-results/
            coverage/
            .vscode-test/**/logs/
          if-no-files-found: warn
          retention-days: 14

  driver-helper:
    name: Windows driver helper
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build libwdi and dedicated helper
        shell: pwsh
        run: ./scripts/build-driver-helper.ps1
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: driver-helper-build
          path: |
            native/driver-helper/x64/Release/
            native/vendor/libwdi/x64/Release/
          if-no-files-found: warn
          retention-days: 14

  extension-host:
    name: VS Code Extension Host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-host
          path: |
            test-results/
            coverage/
            .vscode-test/**/logs/
          if-no-files-found: warn
          retention-days: 14
