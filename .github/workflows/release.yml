name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish or retry, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  build:
    needs: [gates, driver-helper]
    timeout-minutes: 15
    name: Validate and package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and release metadata
        run: node scripts/validate-release.js "$RELEASE_TAG"

      - name: Check release consistency
        run: npm run check:release

      - name: Download signed driver helper
        uses: actions/download-artifact@v4
        with:
          name: signed-driver-helper
          path: resources/driver-helper/win32-x64

      - name: Verify signed helper hashes
        run: node scripts/verify-driver-helper.js

      - name: Package VSIX
        run: npm run package

      - name: Verify VSIX includes signed helper bytes
        run: node scripts/verify-driver-helper.js dist/emberprobe.vsix

      - name: Upload verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: emberprobe-vsix
          path: dist/emberprobe.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    timeout-minutes: 15
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download verified VSIX
        uses: actions/download-artifact@v4
        with:
          name: emberprobe-vsix
          path: dist

      - name: Publish verified release
        run: node scripts/publish-release.js

  driver-helper:
    needs: gates
    timeout-minutes: 20
    name: Build and sign Windows driver helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build libwdi and helper
        shell: pwsh
        run: ./scripts/build-driver-helper.ps1
      - name: Sign helper and library
        shell: pwsh
        env:
          EMBERPROBE_SIGNING_PFX_BASE64: ${{ secrets.EMBERPROBE_SIGNING_PFX_BASE64 }}
          EMBERPROBE_SIGNING_PFX_PASSWORD: ${{ secrets.EMBERPROBE_SIGNING_PFX_PASSWORD }}
        run: ./scripts/sign-driver-helper.ps1
      - name: Upload signed helper
        uses: actions/upload-artifact@v4
        with:
          name: signed-driver-helper
          path: resources/driver-helper/win32-x64/
          if-no-files-found: error
          retention-days: 7
