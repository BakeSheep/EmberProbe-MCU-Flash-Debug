name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry, for example v1.2.3 or v1.2.3-beta.1
        required: true
        type: string
      rebuild:
        description: Rebuild this workflow commit for the same version and replace its VSIX without moving the tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.rebuild && github.sha || inputs.tag || github.ref }}

  build:
    needs: [gates, driver-helper]
    timeout-minutes: 15
    name: Validate and package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.rebuild && github.sha || inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Include Windows sampling timer binary
        run: npm install --no-save --package-lock=false --ignore-scripts --force @koromix/koffi-win32-x64@3.3.1

      - name: Validate tag and release metadata
        run: node scripts/validate-release.js "$RELEASE_TAG"

      - name: Check release consistency
        run: npm run check:release

      - name: Download native driver helper
        uses: actions/download-artifact@v4
        with:
          name: native-driver-helper
          path: resources/driver-helper/win32-x64

      - name: Verify native helper hashes
        run: node scripts/verify-driver-helper.js

      - name: Package VSIX
        run: npm run package

      - name: Verify OpenOCD runtimes and corresponding sources
        run: node scripts/verify-openocd-vsix.js dist/emberprobe.vsix

      - name: Verify VSIX includes native helper bytes
        run: node scripts/verify-driver-helper.js dist/emberprobe.vsix

      - name: Verify VSIX includes Windows sampling timer binary
        run: node scripts/verify-sampling-timer-vsix.js dist/emberprobe.vsix

      - name: Upload verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: emberprobe-vsix
          path: dist/emberprobe.vsix
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified corresponding sources
        uses: actions/upload-artifact@v4
        with:
          name: emberprobe-openocd-source
          path: native/openocd/emberprobe-openocd-source.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    timeout-minutes: 15
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      REPLACE_RELEASE_ASSET: ${{ inputs.rebuild && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.rebuild && github.sha || inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download verified VSIX
        uses: actions/download-artifact@v4
        with:
          name: emberprobe-vsix
          path: dist

      - name: Download verified corresponding sources
        uses: actions/download-artifact@v4
        with:
          name: emberprobe-openocd-source
          path: native/openocd

      - name: Publish verified release
        # Both assets come from the build job that verified their shared identity.
        run: node scripts/publish-release.js

  driver-helper:
    needs: gates
    timeout-minutes: 20
    name: Build Windows driver helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.rebuild && github.sha || inputs.tag || github.ref }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build libwdi and helper
        shell: pwsh
        run: ./scripts/build-driver-helper.ps1
      - name: Verify native helper hashes
        run: node scripts/verify-driver-helper.js
      - name: Upload native helper
        uses: actions/upload-artifact@v4
        with:
          name: native-driver-helper
          path: resources/driver-helper/win32-x64/
          if-no-files-found: error
          retention-days: 7
