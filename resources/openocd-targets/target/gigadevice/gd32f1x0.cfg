# GD32F130/F150. Use a capacity-specific wrapper for 16 or 32 KiB.

if {![info exists _EP_GD32_FAMILY]} {
    set _EP_GD32_FAMILY gd32f1x0
    set _EP_GD32_REVISION 0x1303
    set _EP_GD32_SWDP 0x1ba01477
    set _EP_GD32_JTAG 0x3ba00477
}

if {![info exists FLASH_SIZE]} { set FLASH_SIZE 65536 }
if {![info exists CHIPNAME]} { set CHIPNAME $_EP_GD32_FAMILY }
if {![info exists CPUTAPID]} {
    set CPUTAPID [expr {[using_jtag] ? $_EP_GD32_JTAG : $_EP_GD32_SWDP}]
}

source [find target/stm32f1x.cfg]

# Both GD32 families expose the capacity in a 32-bit ESIG register.
# stm32f1x sets the bank size from FLASH_SIZE, including on Cortex-M4
# where its default capacity probe uses the STM32F3 address.
proc ep_gd32_check_flash {revision size} {
    set id [mrw 0xe0042000]
    if {($id & 0x0fff) != 0x410 || (($id >> 16) & 0xffff) != $revision} {
        error [format "GD32 Flash bank: unsupported device ID 0x%08x" $id]
    }
    set kib [expr {[mrw 0x1ffff7e0] & 0xffff}]
    set allowed [expr {$revision == 0x1303 ? {16 32 64} : {16 32 64 128}}]
    if {$kib ni $allowed || $kib * 1024 != $size} {
        error "GD32 Flash bank: device reports $kib KiB, configuration specifies [expr {$size / 1024}] KiB"
    }
}

# A failed post-init check aborts OpenOCD before program or the GDB server
# can accept writes. examine-end alone cannot propagate errors to init.
proc ep_gd32_require_flash {revision size} {
    if {[catch {ep_gd32_check_flash $revision $size} reason]} {
        echo $reason
        shutdown error
        error $reason
    }
}

# The STM32 event would write debug-control bits before the GD32 check.
$_TARGETNAME configure -event examine-end {}
$_TARGETNAME configure -event reset-init { mmw 0xe0042004 0x00000300 0 }
lappend post_init_commands [list ep_gd32_require_flash $_EP_GD32_REVISION $_FLASH_SIZE]
