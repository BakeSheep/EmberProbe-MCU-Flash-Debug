# GD32F30X single-bank internal Flash
if {![info exists CHIPNAME]} { set CHIPNAME gd32f30x }
if {![info exists FLASH_SIZE]} { set FLASH_SIZE 262144 }
if {![info exists CPUTAPID]} {
    set CPUTAPID [expr {[using_jtag] ? 0x4ba00477 : 0x2ba01477}]
}
set _EP_COMPAT_FLASH {gd32f30x 0xc24 0xe0042000 0xfff {0x414} 0x1ffff7e0 32}
source [find target/emberprobe/f1-compat.tcl]
