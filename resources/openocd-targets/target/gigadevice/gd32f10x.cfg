# GD32F10X single-bank internal Flash
if {![info exists CHIPNAME]} { set CHIPNAME gd32f10x }
if {![info exists FLASH_SIZE]} { set FLASH_SIZE 65536 }
if {![info exists CPUTAPID]} {
    set CPUTAPID [expr {[using_jtag] ? 0x4ba00477 : 0x2ba01477}]
}
if {$FLASH_SIZE <= 32768} { set ids {0x410 0x412} } elseif {$FLASH_SIZE <= 131072} {
    set ids {0x410}
} else { set ids {0x414} }
set _EP_COMPAT_FLASH [list gd32f10x 0xc23 0xe0042000 0xfff $ids 0x1ffff7e0 32]
source [find target/emberprobe/f1-compat.tcl]
