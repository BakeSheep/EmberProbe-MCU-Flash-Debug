# CH32F103 single-bank internal Flash
if {[using_jtag]} { error "CH32F103 supports SWD only" }
if {![info exists CHIPNAME]} { set CHIPNAME ch32f103 }
if {![info exists FLASH_SIZE]} { set FLASH_SIZE 65536 }
if {![info exists CPUTAPID]} {
    set CPUTAPID 0x2ba01477
}
set _EP_COMPAT_FLASH {ch32f103 0xc23 0xe0042000 0xffff0fff {0x20000410} 0x1ffff7e0 16}
source [find target/emberprobe/f1-compat.tcl]
