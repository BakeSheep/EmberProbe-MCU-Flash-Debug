# APM32E030 single-bank internal Flash
if {[using_jtag]} { error "APM32E030 supports SWD only" }
if {![info exists CHIPNAME]} { set CHIPNAME apm32e030 }
set FLASH_SIZE 65536
if {![info exists WORKAREASIZE]} { set WORKAREASIZE 1024 }
if {![info exists CPUTAPID]} {
    set CPUTAPID 0x0bc11477
}
# This wafer ID is documented for the 64 KiB x8 series.
set _EP_COMPAT_FLASH {apm32e030 0xc60 0x40015800 0xffff0fff {0x00100440} 0 0}
source [find target/emberprobe/f1-compat.tcl]
